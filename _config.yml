# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: Lionel London
email: lionel.london@kcl.ac.uk
description: >- # this means to ignore newlines until "baseurl:"
  Lionel London - Lecturer at King's College London.
minimal_mistakes_skin: dark
search: true

# Build settings
markdown: kramdown
remote_theme: mmistakes/minimal-mistakes

# Outputting
permalink: /:categories/:title/
paginate: 5 # amount of posts to show
paginate_path: /page:num/
timezone: Europe/London # https://en.wikipedia.org/wiki/List_of_tz_database_time_zones

include:
  - _pages

# Exclude from processing.
# The following items will not be processed, by default. Create a custom list
# to override the default setting.
# exclude:
#   - Gemfile
#   - Gemfile.lock
#   - node_modules
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/

# Plugins (previously gems:)
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache
  # Collections
collections:
  jupyter:
    output: true
    permalink: /:collection/:path/

# Defaults for jupyter collection
defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true
  # _jupyter (new!)
  - scope:
      path: ""
      type: jupyter
    values:
      layout: single
      author_profile: true
      share: true



author:
  name   : "Lionel London"
  avatar : "/assets/images/bio-photo.jpeg"
  bio    : "Theoretical Physicist | Lecturer at King's College London"
  location: "London, UK"
  links:
    - label: "Email"
      icon: "fas fa-fw fa-envelope-square"
      url: "mailto:lionel.london@kcl.ac.uk"
    - label: "Website"
      icon: "fas fa-fw fa-link"
      url: "https://www.kcl.ac.uk/people/lionel-london"
    - label: "Google Scholar"
      icon: "fas fa-fw fa-graduation-cap"
      url: "https://scholar.google.com/citations?user=HIS_SCHOLAR_ID"
    - label: "arXiv"
      icon: "fas fa-fw fa-book"
      url: "https://arxiv.org/search/?searchtype=author&query=London%2C+L"

header: 
  og_image: "/assets/images/hero.png"

footer:
  links:
    - label: "KCL Profile"
      icon: "fas fa-fw fa-link"
      url: "https://www.kcl.ac.uk/people/lionel-london"

defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
